<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGPL 2027 - Edit Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">
    <!-- NAVIGATION HEADER -->

            <!-- BRAND LOGO & TITLE -->
            <a href="/" class="flex items-center space-x-3 group">

            <!-- DESKTOP NAVIGATION LINKS -->
            <nav class="hidden md:flex items-center space-x-5 text-sm font-semibold">

                    <i class="fa-solid fa-house text-xs"></i>

                <a href="/directory?filter=Player" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-users text-xs text-amber-500"></i>
                    <span>Players</span>
                </a>
                <a href="/directory?filter=Team" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-shield-halved text-xs text-indigo-400"></i>
                    <span>Teams</span>
                </a>
                <a href="/directory?filter=Owner" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-user-tie text-xs text-emerald-400"></i>
                    <span>Owners</span>
                </a>
                <a href="/register" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-user-plus text-xs text-rose-400"></i>
                    <span>Registration</span>
                </a>
                <a href="/edit-profile" class="text-amber-400 transition hover:text-amber-300 flex items-center space-x-1 px-2.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20">
                    <i class="fa-solid fa-user-pen text-xs"></i>
                    <span>Edit Profile</span>
                </a>
                <a href="/admin" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3.5 py-1.5 rounded-xl transition hover:bg-amber-500 hover:text-slate-950 shadow-lg shadow-amber-500/10 flex items-center space-x-1.5">
                    <i class="fa-solid fa-lock text-xs"></i>
                    <span>Admin</span>
                </a>
            </nav>

            <!-- MOBILE HAMBURGER TOGGLE BUTTON -->
            <div class="md:hidden flex items-center space-x-2">
                <a href="/admin" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold">
                    <i class="fa-solid fa-lock mr-1"></i> Admin
                </a>
                <button id="mobile-menu-button" onclick="toggleMobileMenu()" class="text-slate-300 hover:text-amber-400 focus:outline-none p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <i class="fa-solid fa-bars text-lg" id="menu-icon"></i>
                </button>
            </div>
        </div>

        <!-- COLLAPSIBLE MOBILE MENU DROPDOWN -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 px-4 pt-3 pb-5 space-y-2 shadow-2xl">
            <a href="/" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-house w-5 text-center text-amber-500"></i>
                <span>Home</span>
            </a>
            <a href="/directory?filter=Player" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-users w-5 text-center text-amber-500"></i>
                <span>Players Directory</span>
            </a>
            <a href="/directory?filter=Team" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-shield-halved w-5 text-center text-indigo-400"></i>
                <span>Teams</span>
            </a>
            <a href="/directory?filter=Owner" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-user-tie w-5 text-center text-emerald-400"></i>
                <span>Team Owners</span>
            </a>
            <a href="/register" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-user-plus w-5 text-center text-rose-400"></i>
                <span>Registration</span>
            </a>
            <a href="/edit-profile" class="flex items-center space-x-3 text-amber-400 font-semibold py-2.5 px-3 rounded-xl bg-amber-500/10 border border-amber-500/20">
                <i class="fa-solid fa-user-pen w-5 text-center"></i>
                <span>Edit Profile</span>
            </a>

    <main class="max-w-2xl w-full mx-auto p-4 flex-grow">
        <!-- FLOATING TOP-RIGHT NOTIFICATION TOAST -->
        <div id="alert-box" class="fixed top-5 right-5 z-50 hidden transition-all duration-300 transform translate-y-[-10%] opacity-0 max-w-sm p-4 rounded-xl shadow-2xl text-xs font-bold border backdrop-blur-md flex items-center space-x-3">
            <!-- Icon or message placeholder -->
            <span id="alert-icon"></span>
            <span id="alert-text"></span>
        </div>
        <!-- STEP 1: AUTHENTICATION LOGIN CARD -->
        <div id="auth-card" class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-2xl space-y-6">
            <div class="text-center space-y-1">
                <h2 class="text-2xl font-bold text-amber-400">Manage Your Registration</h2>
                <p class="text-xs text-slate-400">Enter your registered Phone/Email and Password to access your profile.</p>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Phone Number or Email *</label>
                    <input type="text" id="auth-identifier" required placeholder="Enter registered phone or email" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Password *</label>
                    <input type="password" id="auth-password" required placeholder="Enter your password" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-black py-3 rounded-xl shadow-lg transition">
                    Access Profile
                </button>
            </form>
        </div>

        <!-- STEP 2: EDIT PROFILE FORM (Hidden until authenticated) -->
        <div id="edit-card" class="bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-2xl space-y-6 hidden">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-xl font-bold text-amber-400">Edit Profile Details</h2>
                <button onclick="location.reload()" class="text-xs text-slate-400 hover:text-rose-400 font-semibold"><i class="fa-solid fa-arrow-rotate-left mr-1"></i> Switch Account</button>
            </div>

            <form id="edit-form" onsubmit="handleUpdate(event)" class="space-y-4" enctype="multipart/form-data">
                <input type="hidden" id="edit-id">
                <!-- Satatus -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Registration Status</label>
                        <input type="text" id="edit-registration-status" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-400 text-sm cursor-not-allowed">
                        
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Auction Status</label>
                        <input type="text" id="edit-auction-status" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-400 text-sm cursor-not-allowed">
                        
                    </div>
                </div>
                <!-- Full Name -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Full Name *</label>
                    <input type="text" id="edit-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>

                <!-- Role (Locked / Read-Only Display with hidden input) & Age -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Role (Locked)</label>
                        <input type="text" id="edit-role-display" disabled class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-400 text-sm cursor-not-allowed">
                        <input type="hidden" id="edit-role">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Age *</label>
                        <input type="number" id="edit-age" required min="10" max="70" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Jersey Size *</label>
                        <select id="edit-jersey-size" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                            <option value="S">S</option>
                            <option value="M">M</option>
                            <option value="L">L</option>
                            <option value="XL">XL</option>
                            <option value="XXL">XXL</option>
                        </select>
                    </div>
                </div>

                <!-- Phone & Email -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Phone Number *</label>
                        <input type="tel" id="edit-phone" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Aadhar Number</label>
                        <input type="text" id="edit-aadhaar" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <!-- Address & Description -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Email Address *</label>
                    <input type="email" id="edit-email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>

                <!-- PLAYER SPECIFIC FIELDS -->
                <div id="edit-player-spec-fields" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Player Category *</label>
                        <select id="edit-category" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                            <option value="Batsman">Batsman</option>
                            <option value="Bowler">Bowler</option>
                            <option value="All-Rounder">All-Rounder</option>
                            <option value="Wicket-Keeper">Wicket-Keeper</option>
                            <option value="Wicket-Keeper + Batsman">Wicket-Keeper + Batsman</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Style *</label>
                        <select id="edit-style" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                            <option value="Right-Handed">Right-Handed</option>
                            <option value="Left-Handed">Left-Handed</option>
                        </select>
                    </div>
                </div>
                <div id="edit-owner-spec-fields">
                    <label class="block text-xs font-bold text-slate-300 mb-1">Team Name *</label>
                    <input type="text" id="edit-teamName" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>
                <!-- Address & Description -->
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Address / Village *</label>
                    <input type="text" id="edit-address"  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">Player Bio / Description</label>
                    <textarea id="edit-description" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm h-20 focus:outline-none focus:border-amber-400"></textarea>
                </div>

                <!-- LOCAL FILE UPLOADS (Role-based & Payment Verification conditioned) -->
                <div class="space-y-4 pt-2 border-t border-slate-800">
                    <!-- Photo Upload (Player / Both) -->
                    <div id="edit-photo-upload-group">
                        <label class="block text-xs font-bold text-slate-300 mb-1">Update Photo (Local File)</label>
                        <input type="file" id="edit-photo-file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400">
                        <p id="current-photo-status" class="text-[10px] text-slate-400 mt-1"></p>
                    </div>

                    <!-- Team Logo Upload (Team Owner / Both) -->
                    <div id="edit-team-logo-upload-group" class="hidden">
                        <label class="block text-xs font-bold text-slate-300 mb-1">Update Team Logo (Local File)</label>
                        <input type="file" id="edit-logo-file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-500 file:text-white hover:file:bg-indigo-400">
                        <p id="current-logo-status" class="text-[10px] text-slate-400 mt-1"></p>
                    </div>

                    <!-- Payment Screenshot Upload (Hidden if paymentVerified is true) -->
                    <div id="edit-payment-upload-wrapper">
                        <label class="block text-xs font-bold text-slate-300 mb-1">Update Payment Screenshot (Local File)</label>
                        <input type="file" id="edit-payment-file" accept="image/*" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-white text-xs file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-500 file:text-slate-950 hover:file:bg-emerald-400">
                        <p id="current-payment-status" class="text-[10px] text-slate-400 mt-1"></p>
                    </div>
                </div>

                <!-- SECURITY & PASSWORD VERIFICATION -->
                <div class="pt-2 border-t border-slate-800 space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-amber-400 mb-1">Confirm Current Password (Required to Save) *</label>
                        <input type="password" id="edit-current-password" required placeholder="Enter current password" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">New Password (Optional)</label>
                        <input type="password" id="edit-new-password" placeholder="Leave blank to keep existing password" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white text-sm focus:outline-none focus:border-amber-400">
                    </div>
                </div>

                <div class="flex space-x-3 pt-2">
                    <button type="submit" class="flex-1 bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-600 hover:to-emerald-700 text-slate-950 font-black py-3.5 rounded-xl shadow-lg transition">
                        Save Changes
                    </button>
                    <button type="button" onclick="location.reload()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-5 py-3.5 rounded-xl transition">
                        Cancel
                    </button>
                </div>
            </form>
        </div>
    </main>

    <script>
        // function showAlert(msg, isError = false) {
        //     const box = document.getElementById('alert-box');
        //     box.className = isError 
        //         ? 'mb-4 p-3 rounded text-sm font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400' 
        //         : 'mb-4 p-3 rounded text-sm font-medium border bg-emerald-500/10 border-emerald-500/30 text-emerald-400';
        //     box.innerText = msg;
        //     box.classList.remove('hidden');
        //     window.scrollTo({ top: 0, behavior: 'smooth' });
        // }
        let alertTimeout = null;

        function showAlert(msg, isError = false) {
            const box = document.getElementById('alert-box');
            const textEl = document.getElementById('alert-text');
            const iconEl = document.getElementById('alert-icon');

            // Clear any existing timeout so quick successive alerts don't clip early
            if (alertTimeout) clearTimeout(alertTimeout);

            // Set styling and icons based on state
            if (isError) {
                box.className = "fixed top-5 right-5 z-50 transition-all duration-300 transform translate-y-0 opacity-100 max-w-sm p-4 rounded-xl shadow-2xl text-xs font-bold border bg-rose-950/90 border-rose-500/40 text-rose-300 flex items-center space-x-3 shadow-rose-950/50";
                iconEl.innerHTML = `<i class="fa-solid fa-circle-exclamation text-rose-400 text-sm"></i>`;
            } else {
                box.className = "fixed top-5 right-5 z-50 transition-all duration-300 transform translate-y-0 opacity-100 max-w-sm p-4 rounded-xl shadow-2xl text-xs font-bold border bg-emerald-950/90 border-emerald-500/40 text-emerald-300 flex items-center space-x-3 shadow-emerald-950/50";
                iconEl.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm"></i>`;
            }

            textEl.innerText = msg;
            box.classList.remove('hidden');

            // Automatically hide after 4 seconds with a smooth fade-out
            alertTimeout = setTimeout(() => {
                box.classList.add('opacity-0', 'translate-y-[-10%]');
                setTimeout(() => {
                    box.classList.add('hidden');
                }, 300); // Matches transition duration
            }, 4000);
        }

        function toggleEditRoleFields(role, paymentVerified) {
            const playerSpec = document.getElementById('edit-player-spec-fields');
            const ownerSpec = document.getElementById('edit-owner-spec-fields');    
            const photoGroup = document.getElementById('edit-photo-upload-group');
            const logoGroup = document.getElementById('edit-team-logo-upload-group');
            const paymentWrapper = document.getElementById('edit-payment-upload-wrapper');

            if (role === 'Player') {
                playerSpec.classList.remove('hidden');
                ownerSpec.classList.add('hidden');
                photoGroup.classList.remove('hidden');
                logoGroup.classList.add('hidden');
            } else if (role === 'Team Owner') {
                playerSpec.classList.add('hidden');
                ownerSpec.classList.remove('hidden');
                photoGroup.classList.remove('hidden');
                logoGroup.classList.remove('hidden');
            } else {
                // Both
                
                playerSpec.classList.remove('hidden');
                ownerSpec.classList.remove('hidden');
                photoGroup.classList.remove('hidden');
                logoGroup.classList.remove('hidden');
            }

            // If payment is already verified by admin, hide the payment screenshot upload option
            if (paymentVerified) {
                paymentWrapper.classList.add('hidden');
            } else {
                paymentWrapper.classList.remove('hidden');
            }
        }

        async function handleAuth(e) {
            e.preventDefault();
            const identifier = document.getElementById('auth-identifier').value;
            const password = document.getElementById('auth-password').value;

            try {
                const res = await fetch('/api/register/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ identifier, password })
                });
                const data = await res.json();

                if (res.ok) {
                    const user = data.registrant;
                    document.getElementById('edit-id').value = user._id;
                    document.getElementById('edit-name').value = user.fullName || '';
                    document.getElementById('edit-role').value = user.role || 'Player';
                    document.getElementById('edit-role-display').value = user.role || 'Player';
                    document.getElementById('edit-age').value = user.age || '';
                    document.getElementById('edit-phone').value = user.phone || '';
                    document.getElementById('edit-email').value = user.email || '';
                    document.getElementById('edit-aadhaar').value = user.aadhaar || '';
                    document.getElementById('edit-address').value = user.address || '';
                    document.getElementById('edit-teamName').value = user.teamName || '';
                    document.getElementById('edit-description').value = user.description || '';
                    document.getElementById('edit-auction-status').value = user.auctionStatus || 'Unsold';
                    document.getElementById('edit-registration-status').value = user.status || 'Pending';
                    if (user.category) document.getElementById('edit-category').value = user.category;
                    if (user.style) document.getElementById('edit-style').value = user.style;
                    if (user.jerseySize) document.getElementById('edit-jersey-size').value = user.jerseySize;
                    // Photo Status Preview
                    if (user.photoUrl) {
                        document.getElementById('current-photo-status').innerHTML = `✓ Photo uploaded. <a href="${user.photoUrl}" target="_blank" class="text-amber-400 underline ml-1">View Current Photo</a>`;
                    } else {
                        document.getElementById('current-photo-status').innerText = `⚠ No member photo uploaded yet.`;
                    }

                    // Team Logo Status Preview
                    if (user.teamLogoUrl) {
                        document.getElementById('current-logo-status').innerHTML = `✓ Team logo uploaded. <a href="${user.teamLogoUrl}" target="_blank" class="text-indigo-400 underline ml-1">View Current Logo</a>`;
                    } else {
                        document.getElementById('current-logo-status').innerText = `⚠ No team logo uploaded yet.`;
                    }

                    // Payment Status Preview
                    if (user.paymentVerified) {
                        document.getElementById('current-payment-status').innerHTML = `<span class="text-emerald-400 font-bold">✓ Payment Verified by Admin</span>`;
                    } else if (user.paymentScreenshotUrl) {
                        document.getElementById('current-payment-status').innerHTML = `✓ Payment screenshot uploaded. <a href="${user.paymentScreenshotUrl}" target="_blank" class="text-emerald-400 underline ml-1">View Screenshot</a>`;
                    } else {
                        document.getElementById('current-payment-status').innerText = `⚠ No payment screenshot uploaded yet.`;
                    }

                    // Apply role-based visibility rules
                    toggleEditRoleFields(user.role, user.paymentVerified);

                    // Switch view from Auth Card to Edit Card
                    document.getElementById('auth-card').classList.add('hidden');
                    document.getElementById('edit-card').classList.remove('hidden');
                    document.getElementById('alert-box').classList.add('hidden');
                } else {
                    showAlert(data.error || 'Authentication failed.', true);
                }
            } catch (err) {
                showAlert('Server connection error.', true);
            }
        }

        async function handleUpdate(e) {
            e.preventDefault();
            const id = document.getElementById('edit-id').value;
            const formData = new FormData();

            formData.append('fullName', document.getElementById('edit-name').value);
            formData.append('role', document.getElementById('edit-role').value);
            formData.append('age', document.getElementById('edit-age').value);
            formData.append('phone', document.getElementById('edit-phone').value);
            formData.append('email', document.getElementById('edit-email').value);
            formData.append('aadhaar', document.getElementById('edit-aadhaar').value);
            formData.append('address', document.getElementById('edit-address').value);
            formData.append('description', document.getElementById('edit-description').value);
            formData.append('category', document.getElementById('edit-category').value);
            formData.append('style', document.getElementById('edit-style').value);
            formData.append('jerseySize', document.getElementById('edit-jersey-size').value);   
            formData.append('password', document.getElementById('edit-current-password').value);
            formData.append('teamName', document.getElementById('edit-teamName').value);
            const newPass = document.getElementById('edit-new-password').value;
            if (newPass) formData.append('newPassword', newPass);

            // Files
            const photoFile = document.getElementById('edit-photo-file').files[0];
            if (photoFile) formData.append('photo', photoFile);

            const logoFile = document.getElementById('edit-logo-file').files[0];
            if (logoFile) formData.append('teamLogo', logoFile);

            const paymentFile = document.getElementById('edit-payment-file').files[0];
            if (paymentFile) formData.append('paymentScreenshot', paymentFile);

            try {
                const res = await fetch(`/api/register/${id}`, {
                    method: 'PUT',
                    body: formData
                });
                const data = await res.json();

                if (res.ok) {
                    showAlert(data.message || 'Profile updated successfully!');
                    setTimeout(() => location.reload(), 2000);
                } else {
                    showAlert(data.error || 'Update failed.', true);
                }
            } catch (err) {
                showAlert('Failed to update profile.', true);
            }
        }
    </script>
    <script src="./static/js/common.js"></script>
</body>
</html>
