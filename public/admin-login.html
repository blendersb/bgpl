<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGPL 2026 - Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-center items-center p-4">
    <div class="max-w-sm w-full bg-slate-800 rounded-xl p-6 border border-slate-700 shadow-2xl space-y-4">
        <h2 class="text-xl font-bold text-amber-400 text-center"><i class="fa-solid fa-user-shield mr-2"></i> Admin Login</h2>
        <div id="alert-box" class="hidden p-2 rounded text-xs font-medium border bg-rose-500/10 border-rose-500/30 text-rose-400"></div>
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-400 mb-1">Username</label>
                <input type="text" id="admin-user" required value="admin" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">Admin PIN Code</label>
                <input type="password" id="admin-pin" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-white text-sm">
            </div>
            <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg shadow-lg text-sm">Login</button>
        </form>
        <div class="text-center"><a href="/" class="text-xs text-slate-400 hover:text-amber-400">← Back to Home</a></div>
    </div>
    <script>
        if (localStorage.getItem('BGPL_JWT')) window.location.href = '/admin/dashboard';
        async function handleLogin(e) {
            e.preventDefault();
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('admin-user').value,
                    pin: document.getElementById('admin-pin').value
                })
            });
            const data = await res.json();
            if (res.ok) {
                localStorage.setItem('BGPL_JWT', data.token);
                window.location.href = '/admin/dashboard';
            } else {
                const box = document.getElementById('alert-box');
                box.innerText = data.error || 'Login failed';
                box.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
