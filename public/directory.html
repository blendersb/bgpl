<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGPL 2027 - Players & Owners Directory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">
    <!-- NAVIGATION -->
    <!-- NAVIGATION HEADER -->
    <header class="glass-nav sticky top-0 z-50 shadow-2xl bg-slate-950/80 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            
            <!-- BRAND LOGO & TITLE -->
            <a href="/" class="flex items-center space-x-3 group">
                <img src="./static/logo-n.png" alt="BGPL Logo" class="w-10 h-10 object-contain rounded-xl bg-slate-900/80 p-1 border border-amber-500/30 group-hover:border-amber-400 transition">
                <div>
                    <h1 class="text-lg font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-amber-200 to-yellow-400">BGPL 2027</h1>
                    <p class="text-[10px] text-slate-400 font-medium tracking-widest uppercase">Bamundi Gram Premier League</p>
                </div>
            </a>

            <!-- DESKTOP NAVIGATION LINKS -->
            <nav class="hidden md:flex items-center space-x-5 text-sm font-semibold">
                <a href="/" class="text-amber-400 transition hover:text-amber-300 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl ">
                    <i class="fa-solid fa-house text-xs"></i>
                    <span>Home</span>
                </a>
                <a href="/directory?filter=Player" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900 bg-amber-500/10 border border-amber-500/20">
                    <i class="fa-solid fa-users text-xs text-amber-500"></i>
                    <span>Players</span>
                </a>
                <a href="/directory?filter=Team" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-shield-halved text-xs text-indigo-400"></i>
                    <span>Teams</span>
                </a>
                <a href="/directory?filter=Owner" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-user-tie text-xs text-emerald-400"></i>
                    <span>Owners</span>
                </a>
                <a href="/register" class="text-slate-300 transition hover:text-amber-400 flex items-center space-x-1.5 px-3 py-1.5 rounded-xl hover:bg-slate-900">
                    <i class="fa-solid fa-user-plus text-xs text-rose-400"></i>
                    <span>Registration</span>
                </a>
                <a href="/edit-profile" class="text-emerald-400 transition hover:text-emerald-300 flex items-center space-x-1 px-2.5 py-1.5 rounded-xl">
                    <i class="fa-solid fa-user-pen text-xs"></i>
                    <span>Edit Profile</span>
                </a>
                <a href="/admin" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3.5 py-1.5 rounded-xl transition hover:bg-amber-500 hover:text-slate-950 shadow-lg shadow-amber-500/10 flex items-center space-x-1.5">
                    <i class="fa-solid fa-lock text-xs"></i>
                    <span>Admin</span>
                </a>
            </nav>

            <!-- MOBILE HAMBURGER TOGGLE BUTTON -->
            <div class="md:hidden flex items-center space-x-2">
                <a href="/admin" class="bg-amber-500/10 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-xl text-xs font-bold">
                    <i class="fa-solid fa-lock mr-1"></i> Admin
                </a>
                <button id="mobile-menu-button" onclick="toggleMobileMenu()" class="text-slate-300 hover:text-amber-400 focus:outline-none p-2 rounded-xl bg-slate-900 border border-slate-800">
                    <i class="fa-solid fa-bars text-lg" id="menu-icon"></i>
                </button>
            </div>
        </div>

        <!-- COLLAPSIBLE MOBILE MENU DROPDOWN -->
        <div id="mobile-menu" class="hidden md:hidden bg-slate-950/95 backdrop-blur-xl border-t border-slate-800 px-4 pt-3 pb-5 space-y-2 shadow-2xl">
            <a href="/" class="flex items-center space-x-3 text-amber-400 font-semibold py-2.5 px-3 rounded-xl bg-amber-500/10 border border-amber-500/20">
                <i class="fa-solid fa-house w-5 text-center text-amber-500"></i>
                <span>Home</span>
            </a>
            <a href="/directory?filter=Player" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-users w-5 text-center text-amber-500"></i>
                <span>Players Directory</span>
            </a>
            <a href="/directory?filter=Team" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-shield-halved w-5 text-center text-indigo-400"></i>
                <span>Teams</span>
            </a>
            <a href="/directory?filter=Owner" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-user-tie w-5 text-center text-emerald-400"></i>
                <span>Team Owners</span>
            </a>
            <a href="/register" class="flex items-center space-x-3 text-slate-300 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-user-plus w-5 text-center text-rose-400"></i>
                <span>Registration</span>
            </a>
            <a href="/edit-profile" class="flex items-center space-x-3 text-emerald-400 font-semibold py-2.5 px-3 rounded-xl hover:bg-slate-900 transition">
                <i class="fa-solid fa-user-pen w-5 text-center"></i>
                <span>Edit Profile</span>
            </a>
        </div>
    </header>

    <main class="max-w-7xl w-full mx-auto p-4 space-y-6 flex-grow">
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-900/60 p-6 rounded-2xl border border-slate-800">
            <div>
                <h2 id="directory-header-title" class="text-2xl font-black text-white">Approved Players & Franchise Owners</h2>
                <p class="text-xs text-slate-400">Browse verified participants ready for the auction and tournament matches.</p>
            </div>
            <div class="relative w-full md:w-72">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400"><i class="fa-solid fa-search"></i></span>
                <input type="text" id="directory-search" oninput="renderDirectory()" placeholder="Search participant..." class="w-full bg-slate-950 border border-slate-700/80 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-amber-400 shadow-inner">
            </div>
        </div>
        <div id="directory-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>
<!-- GLOBAL DETAILS MODAL -->
<div id="details-modal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-5 relative">
        <button onclick="closeDetailsModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 w-8 h-8 rounded-full flex items-center justify-center transition">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div id="modal-content" class="space-y-4 pt-2">
            <!-- Dynamically populated content goes here -->
        </div>
    </div>
</div>
    <script>
        let allRegistrants = [];
        // Read query parameters from URL (e.g., ?filter=Player)
        const urlParams = new URLSearchParams(window.location.search);
        const currentFilter = urlParams.get('filter') || 'All';
        const playerId = urlParams.get('id');
        const franchise = urlParams.get('team');
        // Update page title/header based on filter
        const headerTitle = document.getElementById('directory-header-title');
        if (headerTitle) {
            if (currentFilter === 'Owner') headerTitle.innerText = "Team Owners Directory";
            else if (currentFilter === 'Team') headerTitle.innerText = "Participating Teams & Squads";
            else if (currentFilter === 'Player') headerTitle.innerText = "Players Directory";
            else headerTitle.innerText = "Tournament Directory";
        }
        // Fetch data with filter applied
        fetch(`/api/public/data${currentFilter !== 'All' ? `?filter=${currentFilter}` : ''}`)
            .then(res => res.json())
            .then(data => {
                allRegistrants = data.players || [];
                console.log("Fetched Registrants:", allRegistrants,currentFilter);
                renderDirectory();
            });

        function renderDirectory() {
            if(playerId) {
                // If a specific player ID is provided, filter to that player only
                const specificPlayer = allRegistrants.find(p => p.playerId === playerId);
                if (specificPlayer) {
                    allRegistrants = [specificPlayer];
                } else {
                    document.getElementById('directory-grid').innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-slate-800">No participant found with ID: ${playerId}</div>`;
                    return;
                }
            }
            if(franchise) {
                // If a specific team is provided, filter to that team only
                //const specificTeam = allRegistrants.find(p => p.assignedTeam === franchise || p.teamName === franchise);
            const specificTeam = allRegistrants.find(p => {
                const franchiseClean = franchise?.trim().toLowerCase();
                
                const assignedClean = p.assignedTeam?.trim().toLowerCase();
                const isValidAssigned = assignedClean && assignedClean !== "" && assignedClean !== "none";
                
                const teamNameClean = p.teamName?.trim().toLowerCase();
                const isValidTeamName = teamNameClean && teamNameClean !== "" && teamNameClean !== "none";

                return (isValidAssigned && assignedClean === franchiseClean) ||
                    (isValidTeamName && teamNameClean === franchiseClean);
            });
                
                if (specificTeam) {
                    allRegistrants = [specificTeam];
                } else {
                    document.getElementById('directory-grid').innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-slate-800">No Franchise found with team: ${franchise}</div>`;
                    return;
                }
            }
            const query = document.getElementById('directory-search').value.toLowerCase();
            const grid = document.getElementById('directory-grid');

            let filtered = allRegistrants.filter(p => p.fullName.toLowerCase().includes(query)|| p.assignedTeam.toLowerCase().includes(query)|| (p.playerId && p.playerId.toLowerCase().includes(query)));

            if (currentFilter === 'Owner') {
                // --- 1. OWNERS VIEW ---
                filtered = filtered.filter(p => p.role === 'Team Owner' || p.role === 'Both');
                
                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-slate-800">No team owners found.</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(owner => `
                        <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 bg-slate-900/60 shadow-2xl flex flex-row items-stretch p-3 gap-4 w-full max-w-md">
                        <!-- Left Side: Photo with Badge -->
                        <div class="w-36 sm:w-40 h-auto min-h-[160px] rounded-xl overflow-hidden relative flex-shrink-0 bg-slate-950">
                            <img src="${owner.photoUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80'}" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow">PLAYER</span>
                        </div>

                        <!-- Right Side: Name, Details & Button -->
                        <div class="flex-1 flex flex-col justify-between min-w-0 py-1">
                            <div class="space-y-2.5">
                                <h3 class="font-black text-white text-2xl tracking-tight truncate">${owner.fullName}</h3>
                                
                                <div class="space-y-1.5 text-xs">
                                    <div class="flex justify-between items-center gap-2">
                                        <span class="text-slate-400 font-medium">Franchise Team:</span>
                                        <span class="font-bold text-amber-400 tracking-wide">${owner.assignedTeam && owner.assignedTeam !== 'None' ? owner.assignedTeam : 'Independent'}</span>
                                    </div>
                                    <div class="flex justify-between items-center gap-2">
                                        <span class="text-slate-400 font-medium">Phone:</span> 
                                        <span class="font-bold text-emerald-400">${owner.phone || 'N/A'}</span>
                                    </div>
                                    
                                </div>
                            </div>

                            <div class="pt-3">
                                <button onclick='openOwnerModal(${JSON.stringify(owner)})' class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2 px-3 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-lg shadow-amber-400/10">
                                    <i class="fa-solid fa-user text-xs"></i>
                                    <span>Show Details</span>
                                    <i class="fa-solid fa-circle-info text-xs"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `).join('');

            } else if (currentFilter === 'Team') {
                // --- TEAMS & SQUADS DIRECTORY VIEW ---
                const owners = allRegistrants.filter(p => p.role === 'Team Owner' || p.role === 'Both');
                
                const teamNames = [...new Set([
                    ...owners.map(o => o.teamName).filter(t => t && t !== 'None'),
                    ...allRegistrants.map(p => p.teamName).filter(t => t && t !== 'None')
                ])];

                if (teamNames.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-slate-800">No teams formed yet.</div>`;
                    return;
                }

                // Pass allRegistrants to the open function so the modal can filter the squad live
                grid.innerHTML = teamNames.map(teamName => {
                    const teamOwner = owners.find(o => o.teamName === teamName) || { fullName: 'Unassigned', phone: 'N/A', photoUrl: '', email: 'N/A' };
                    const squad = allRegistrants.filter(p => p.assignedTeam === teamName);
                    const logoUrl = teamOwner.photoUrl || `https://api.dicebear.com/7.x/identicon/svg?seed=${encodeURIComponent(teamName)}`;

                    // Serialize data safely for the click handler
                    const teamPayload = {
                        teamName,
                        logoUrl,
                        owner: teamOwner,
                        squad: squad
                    };

                    return `
                        <div class="glass-card rounded-2xl p-6 space-y-5 border border-slate-800 shadow-xl col-span-1 md:col-span-2 flex flex-col justify-between">
                            <!-- Team Header -->
                            <div class="flex items-center space-x-4 border-b border-slate-800 pb-4">
                                <img src="${logoUrl}" class="w-16 h-16 rounded-full bg-slate-900 border-2 border-amber-500/40 p-1 object-cover">
                                <div class="flex-1">
                                    <h3 class="text-xl font-black text-white">${teamName}</h3>
                                    <p class="text-xs text-amber-400 font-semibold mt-0.5"><i class="fa-solid fa-user-tie mr-1"></i> Owner: ${teamOwner.fullName}</p>
                                </div>
                            </div>

                            <!-- Summary Stats -->
                            <div class="grid grid-cols-2 gap-4 text-xs text-slate-300 bg-slate-950/40 p-3 rounded-xl border border-slate-800/60">
                                <div><span class="text-slate-500 block">Total Squad Members:</span> <span class="font-bold text-white text-sm">${squad.length}</span></div>
                                <div><span class="text-slate-500 block">Franchise Status:</span> <span class="font-bold text-emerald-400 text-sm">Active</span></div>
                            </div>

                            <!-- Action Button -->
                            <button onclick='openTeamModal(${JSON.stringify(teamPayload)})' class="w-full bg-amber-500/10 border border-amber-500/30 text-amber-400 hover:bg-amber-500 hover:text-slate-950 font-bold py-3 rounded-xl transition text-xs flex items-center justify-center space-x-2">
                                <i class="fa-solid fa-shield-halved"></i>
                                <span>View Team Details & Full Squad</span>
                            </button>
                        </div>
                    `;
                }).join('');

            } else {
                // --- 3. DEFAULT PLAYERS VIEW ---
                filtered = filtered.filter(p => p.role === 'Player' || p.role === 'Both');
                
                if (filtered.length === 0) {
                    grid.innerHTML = `<div class="col-span-full py-16 text-center text-slate-400 bg-slate-900/40 rounded-2xl border border-slate-800">No players found.</div>`;
                    return;
                }

                grid.innerHTML = filtered.map(player => `
                    <div class="glass-card rounded-2xl overflow-hidden border border-slate-800 bg-slate-900/60 shadow-2xl flex flex-row items-stretch p-3 gap-4 w-full max-w-md">
    <!-- Left Side: Photo with Badge -->
    <div class="w-36 sm:w-40 h-auto min-h-[160px] rounded-xl overflow-hidden relative flex-shrink-0 bg-slate-950">
        <img src="${player.photoUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80'}" class="w-full h-full object-cover">
        <span class="absolute top-2 left-2 bg-amber-500 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-wider shadow">PLAYER</span>
    </div>

    <!-- Right Side: Name, Details & Button -->
    <div class="flex-1 flex flex-col justify-between min-w-0 py-1">
        <div class="space-y-2.5">
            <h3 class="font-black text-white text-2xl tracking-tight truncate">${player.fullName}</h3>
            
            <div class="space-y-1.5 text-xs">
                <div class="flex justify-between items-center gap-2">
                    <span class="text-slate-400 font-medium">Player ID:</span> 
                    <span class="font-bold text-amber-400 tracking-wide">${player.playerId || 'N/A'}</span>
                </div>
                <div class="flex justify-between items-center gap-2">
                    <span class="text-slate-400 font-medium">Auction Status:</span> 
                    <span class="font-bold text-emerald-400">${player.auctionStatus || 'Unsold'}</span>
                </div>
                <div class="flex justify-between items-center gap-2">
                    <span class="text-slate-400 font-medium">Assigned Team:</span> 
                    <span class="font-bold text-white truncate max-w-[130px]">${player.assignedTeam || 'Unassigned'}</span>
                </div>
            </div>
        </div>

        <div class="pt-3">
            <button onclick='openPlayerModal(${JSON.stringify(player)})' class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-2 px-3 rounded-xl transition text-xs flex items-center justify-center gap-2 shadow-lg shadow-amber-400/10">
                <i class="fa-solid fa-user text-xs"></i>
                <span>Show Details</span>
                <i class="fa-solid fa-circle-info text-xs"></i>
            </button>
        </div>
    </div>
</div>
                `).join('');
            }
        }


function openPlayerModal(player) {
            const modalContent = document.getElementById('modal-content');
            modalContent.innerHTML = `
                <div class="flex items-center space-x-4 border-b border-slate-800 pb-4">
                    <img src="${player.photoUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}" class="w-16 h-16 rounded-xl object-cover border border-amber-500/40">
                    <div>
                        <h3 class="text-lg font-black text-white">${player.fullName}</h3>
                        <p class="text-xs text-amber-400 font-bold">${player.playerId || 'N/A'} </p>
                    </div>
                </div>
                <div class="space-y-2 text-xs text-slate-300">
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Phone:</span> <span class="font-bold text-white">${player.phone || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Address:</span> <span class="font-bold text-white">${player.address || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Email:</span> <span class="font-bold text-white">${player.email || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Age:</span> <span class="font-bold text-white">${player.age || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Category:</span> <span class="font-bold text-white">${player.category || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Batting / Bowling Style:</span> <span class="font-bold text-white">${player.style || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Jersey Size:</span> <span class="font-bold text-white">${player.jerseySize || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Team:</span> <span class="font-bold text-white">${player.assignedTeam || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Designation:</span> <span class="font-bold text-white">${player.teamDesignation || 'N/A'}</span></div>
                    <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Auction Status:</span> <span class="font-bold text-emerald-400">${player.auctionStatus || 'Unsold'} (₹${player.soldPrice || 500})</span></div>
                    
                </div>
            `;
            // <div class="bg-slate-950/40 p-2.5 rounded-lg space-y-1">
            //     <span class="text-slate-500 block">Bio / Description:</span>
            //     <p class="text-slate-300 italic">${player.description || 'No description provided.'}</p>
            // </div>
            document.getElementById('details-modal').classList.remove('hidden');
    }

function openOwnerModal(owner) {
    const modalContent = document.getElementById('modal-content');
    modalContent.innerHTML = `
        <div class="flex items-center space-x-4 border-b border-slate-800 pb-4">
            <img src="${owner.photoUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80'}" class="w-16 h-16 rounded-xl object-cover border border-indigo-500/40">
            <div>
                <h3 class="text-lg font-black text-white">${owner.fullName}</h3>
                <p class="text-xs text-indigo-400 font-bold">Team Owner</p>
            </div>
        </div>
        <div class="space-y-2 text-xs text-slate-300">
            <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Franchise Team:</span> <span class="font-bold text-amber-400">${owner.assignedTeam || 'Independent'}</span></div>
            <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Phone:</span> <span class="font-bold text-white">${owner.phone || 'N/A'}</span></div>
            <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Email:</span> <span class="font-bold text-white">${owner.email || 'N/A'}</span></div>
            <div class="flex justify-between bg-slate-950/40 p-2.5 rounded-lg"><span class="text-slate-500">Address:</span> <span class="font-bold text-white">${owner.address || 'N/A'}</span></div>
        </div>
    `;
    document.getElementById('details-modal').classList.remove('hidden');
}

function openTeamModal(data) {
    const modalContent = document.getElementById('modal-content');
    
    modalContent.innerHTML = `
        <!-- Modal Franchise Header -->
